name: Build app (Android + web)

# Every push: builds both Android apps — Bloomko East (Bloomko.apk) and Bloomko Heritage
# (BloomkoHeritage.apk) — publishes them as a release and replaces the downloads on the website
# (LanguageMaster.apk is kept as an alias for old links). The web app itself is left unchanged.
# The new web apps go to .../preview/ (East) and .../preview-heritage/ (Heritage) behind an
# access code (not indexed, not linked anywhere), so they can be checked before release.
#
# To also publish the web app (https://<owner>.github.io/<repo>/), run this
# workflow manually (Actions → Run workflow) with "Publish web app" ticked.
# One-time setup: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).

on:
  push:
    paths:
      - "app/**"
      - "mobile/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish_web:
        description: "Publish web app too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must keep increasing so installed apps accept updates (old workflow got to 6).
      APP_VERSION: ${{ github.run_number }}
    steps:
      - name: Version number
        run: echo "APP_VERSION=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Two apps from one code base: Bloomko East (Chinese, Japanese) and Bloomko Heritage (Slovenian).
      - name: Build web assets (East)
        working-directory: mobile
        run: |
          npm ci
          npm run build
          rm -rf ../www-east && cp -r www ../www-east
          npx cap sync android

      - name: Build APK (East)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleEastDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/east/debug/app-east-debug.apk "$GITHUB_WORKSPACE/Bloomko.apk"

      - name: Build web assets (Heritage)
        working-directory: mobile
        run: |
          EDITION=heritage npm run build
          rm -rf ../www-heritage && cp -r www ../www-heritage
          npx cap sync android

      - name: Build APK (Heritage)
        working-directory: mobile/android
        run: |
          ./gradlew assembleHeritageDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/heritage/debug/app-heritage-debug.apk "$GITHUB_WORKSPACE/BloomkoHeritage.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Bloomko-apks
          path: |
            Bloomko.apk
            BloomkoHeritage.apk

      # Only when asked for: replace the whole website with the new web app (+ APK).
      - name: Prepare web app
        if: github.event_name == 'workflow_dispatch' && inputs.publish_web
        run: |
          # East at the root, Heritage at /heritage/
          cp -r www-heritage www-east/heritage
          cp Bloomko.apk www-east/Bloomko.apk
          cp Bloomko.apk www-east/LanguageMaster.apk
          cp BloomkoHeritage.apk www-east/BloomkoHeritage.apk
          touch www-east/.nojekyll

      - name: Publish web app + APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: www-east
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish Bloomko 1.10.${{ env.APP_VERSION }} (web + app)"

      # Default: the new web app only as a locked preview (asks for an access code) at .../preview/.
      - name: Prepare locked web previews
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        working-directory: mobile
        run: |
          node scripts/make-preview.mjs ../www-east ../preview-out/preview
          node scripts/make-preview.mjs ../www-heritage ../preview-out/preview-heritage

      - name: Publish locked web previews
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: preview-out
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Locked web previews 1.10.${{ env.APP_VERSION }}"

      # Default: update only the APK download, keep the published web app as it is.
      - name: Prepare APK-only update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        run: |
          mkdir -p apk-only
          cp Bloomko.apk apk-only/Bloomko.apk
          cp BloomkoHeritage.apk apk-only/BloomkoHeritage.apk
          # Old download link keeps working
          cp Bloomko.apk apk-only/LanguageMaster.apk

      - name: Publish APK only
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apk-only
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Update Android app 1.10.${{ env.APP_VERSION }}"

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.${{ env.APP_VERSION }}
          name: Bloomko 1.10.${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Bloomko.apk
            BloomkoHeritage.apk
          body: |
            **Bloomko East** (Chinese, Japanese): Bloomko.apk · **Bloomko Heritage** (Slovenian): BloomkoHeritage.apk
            Install on your phone: download the APK below and open it
            (allow "install unknown apps" for your browser when asked).
            Built from ${{ github.sha }}.

name: Build app (Android + web)

# Every push: builds the Android APK, publishes it as a release and replaces
# .../LanguageMaster.apk on the website. The web app itself is left unchanged.
#
# To also publish the web app (https://<owner>.github.io/<repo>/), run this
# workflow manually (Actions → Run workflow) with "Publish web app" ticked.
# One-time setup: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).

on:
  push:
    paths:
      - "app/**"
      - "mobile/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish_web:
        description: "Publish web app too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must keep increasing so installed apps accept updates (old workflow got to 6).
      APP_VERSION: ${{ github.run_number }}
    steps:
      - name: Version number
        run: echo "APP_VERSION=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web assets
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LanguageMaster.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LanguageMaster-apk
          path: LanguageMaster.apk

      # Only when asked for: replace the whole website with the new web app (+ APK).
      - name: Prepare web app
        if: github.event_name == 'workflow_dispatch' && inputs.publish_web
        run: |
          cp LanguageMaster.apk mobile/www/LanguageMaster.apk
          touch mobile/www/.nojekyll

      - name: Publish web app + APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish Language Master 1.0.${{ env.APP_VERSION }} (web + app)"

      # Default: update only the APK download, keep the published web app as it is.
      - name: Prepare APK-only update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        run: |
          mkdir -p apk-only
          cp LanguageMaster.apk apk-only/LanguageMaster.apk

      - name: Publish APK only
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_web) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apk-only
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Update Android app 1.0.${{ env.APP_VERSION }}"

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.APP_VERSION }}
          name: Language Master 1.0.${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: LanguageMaster.apk
          body: |
            Install on your phone: download **LanguageMaster.apk** below and open it
            (allow "install unknown apps" for your browser when asked).
            Built from ${{ github.sha }}.

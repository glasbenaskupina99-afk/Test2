name: Publish web app

# Builds the browser version and publishes it to the gh-pages branch.
# One-time setup: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).
# The site is then at https://<owner>.github.io/<repo>/

on:
  push:
    paths:
      - "app/**"
      - "mobile/src/**"
      - "mobile/web/**"
      - "mobile/scripts/**"
      - "mobile/package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build web app
        working-directory: mobile
        run: |
          npm ci
          npm run build
          touch www/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish web app"

<style>
  html, body { background: #1c3026; }
  #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 30% 20%, #2b4a38, #16271e 75%); transition: opacity .4s ease; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash svg { width: 190px; height: 190px; overflow: visible; }
  #splash .leaf { transform-origin: 0% 50%; transform-box: fill-box; animation: sp-grow .9s cubic-bezier(.3,1.4,.5,1) both; }
  #splash .outline { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .8s ease-out .1s forwards; }
  #splash .fill { opacity: 0; animation: sp-fade .5s ease .55s forwards; }
  #splash .vein { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .5s ease-out .85s forwards; }
  #splash .stem { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw .35s ease-out forwards; }
  #splash .sway { transform-box: fill-box; transform-origin: 5% 95%; animation: sp-sway 1.6s ease-in-out .9s both; }
  #splash .ch { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sp-pop .35s cubic-bezier(.3,1.6,.5,1) forwards; }
  #splash .name { font: 900 30px/1 "Nunito", system-ui, sans-serif; color: #f3ead8; letter-spacing: .5px; opacity: 0; transform: translateY(10px);
    animation: sp-up .5s ease 1.25s forwards; }
  #splash .dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #e8d48a; opacity: 0; box-shadow: 0 0 8px 2px rgba(232,212,138,.6);
    animation: sp-fly 1.8s ease-out forwards; }
  @keyframes sp-grow { from { transform: scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sp-pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes sp-draw { to { stroke-dashoffset: 0; } }
  @keyframes sp-fade { to { opacity: 1; } }
  @keyframes sp-up { to { opacity: 1; transform: none; } }
  @keyframes sp-sway { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } }
  @keyframes sp-fly { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), -70px); } }
</style>

<script>
  // Short opening animation: stays ~2 s (or until the first screen is drawn), then fades into the app.
  (function () {
    var t0 = Date.now();
    function done() {
      var s = document.getElementById("splash");
      if (!s) return;
      s.classList.add("out");
      setTimeout(function () { s.remove(); }, 450);
    }
    function check() {
      var ready = document.getElementById("app") && document.getElementById("app").children.length;
      if ((ready && Date.now() - t0 >= 2000) || Date.now() - t0 > 6000) done();
      else setTimeout(check, 100);
    }
    setTimeout(check, 2000);
  })();
</script>

<script>
(function () {
  var KEY = "bloomko-preview";

  document.head.appendChild(st);
  function sha(t) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function (b) {
      return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
    });
  }
  document.addEventListener("DOMContentLoaded", function () {
    var g = document.createElement("div");
    g.id = "preview-gate";
    g.innerHTML = '<form><div style="font-size:44px">🔒</div><b>Bloomko preview</b><small>This version is not public yet.</small><input autocomplete="off" placeholder="Access code" aria-label="Access code"><button>Open</button><small class="err"></small></form>';
    document.body.appendChild(g);
    g.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      sha(g.querySelector("input").value.trim().toUpperCase()).then(function (h) {
        if (h !== "951a6465efaa924ba26c4b3cc3d8b135837c1b82a6abd137b14d9655ce5a6113") { g.querySelector(".err").textContent = "Wrong code"; return; }
        try { localStorage.setItem(KEY, h); } catch (e) {}
        location.reload();
      });
    });
  });
})();
</script>

  #splash.out .logo { transform: scale(1.06); }
  #splash .logo { position: relative; width: 196px; height: 196px; transition: transform .5s cubic-bezier(.22,1,.36,1); }
  #splash .layer { position: absolute; inset: 0; will-change: transform, opacity; backface-visibility: hidden; }
  #splash .layer svg { width: 100%; height: 100%; display: block; }
  #splash .glow { inset: -30%; border-radius: 50%; background: radial-gradient(circle, rgba(211,155,50,.28), rgba(211,155,50,0) 62%);
    opacity: 0; animation: sp-glow 2.2s cubic-bezier(.22,1,.36,1) .1s forwards; }
  #splash .float { animation: sp-float 2.6s ease-in-out .9s infinite alternate; transform-origin: 22% 78%; }
  #splash .leaf { opacity: 0; transform-origin: 22% 78%; animation: sp-grow 1.05s cubic-bezier(.22,1,.36,1) .05s forwards; }
  #splash .ch { opacity: 0; transform: scale(.55); animation: sp-pop .6s cubic-bezier(.22,1,.36,1) forwards; }
  #splash .name { font: 700 30px/1 "Lora", Georgia, serif; color: #33241b; letter-spacing: .5px; opacity: 0; transform: translate3d(0,12px,0);
    will-change: transform, opacity; animation: sp-up .7s cubic-bezier(.22,1,.36,1) 1.15s forwards; }
  #splash .dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #e8d48a; opacity: 0; box-shadow: 0 0 8px 2px rgba(232,212,138,.6);
    will-change: transform, opacity; animation: sp-fly 2s cubic-bezier(.3,.6,.4,1) forwards; }
  @keyframes sp-glow { 0% { opacity: 0; transform: scale(.5); } 60% { opacity: 1; } 100% { opacity: .7; transform: scale(1); } }
  @keyframes sp-grow { from { opacity: 0; transform: scale(.45) rotate(-22deg); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes sp-pop { to { opacity: 1; transform: none; } }
  @keyframes sp-up { to { opacity: 1; transform: none; } }
  @keyframes sp-float { from { transform: rotate(0deg) translate3d(0,0,0); } to { transform: rotate(-3deg) translate3d(0,-3px,0); } }
  @keyframes sp-fly { 0% { opacity: 0; transform: translate3d(0,0,0); } 25% { opacity: .9; } 100% { opacity: 0; transform: translate3d(var(--dx),-80px,0); } }

<script>
  // Short opening animation: stays ~2 s (or until the first screen is drawn), then fades into the app.
  (function () {
    var t0 = Date.now();
    // A gentle nature sound with it: a breath of wind, kalimba notes as the leaf grows and the
    // letters appear, and a little bird when the name shows. Skipped when sounds are turned off.
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && localStorage.getItem("sounds") !== "off") {
        var c = new Ctx();
        window.__splashAudio = c;
        var t = c.currentTime + 0.05;
        var out = c.createGain();
        out.gain.value = 0.45;
        out.connect(c.destination);
        var env = function (g, at, peak, attack, end) {
          g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(peak, at + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, end);
        };
        var pluck = function (f, at, dur, vol) {
          [[1, 1, dur], [3.01, 0.3, dur * 0.25], [5.4, 0.1, dur * 0.12]].forEach(function (p) {
            var o = c.createOscillator(), g = c.createGain();
            o.frequency.value = f * p[0];
            env(g, at, vol * p[1], 0.01, at + p[2]);
            o.connect(g).connect(out);
            o.start(at); o.stop(at + dur + 0.05);
          });
        };
        var chirp = function (at, from, to, dur, vol) {
          var o = c.createOscillator(), g = c.createGain();
          o.frequency.setValueAtTime(from, at);
          o.frequency.exponentialRampToValueAtTime(to, at + dur);
          env(g, at, vol, dur * 0.3, at + dur);
          o.connect(g).connect(out);
          o.start(at); o.stop(at + dur + 0.02);
        };
        // Wind: soft filtered noise that swells while the leaf grows.
        var len = c.sampleRate * 2.4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0), last = 0;
        for (var i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
        var src = c.createBufferSource(), bp = c.createBiquadFilter(), wg = c.createGain();
        src.buffer = buf; bp.type = "bandpass"; bp.Q.value = 0.6;
        bp.frequency.setValueAtTime(400, t); bp.frequency.linearRampToValueAtTime(1100, t + 1); bp.frequency.linearRampToValueAtTime(600, t + 2.3);
        env(wg, t, 0.35, 0.8, t + 2.3);
        src.connect(bp).connect(wg).connect(out);
        src.start(t); src.stop(t + 2.4);
        // Kalimba: a low note for the leaf, then one rising note per letter.
        pluck(261.63, t + 0.1, 1.6, 0.35);
        pluck(392, t + 0.3, 1.4, 0.22);
        [523.25, 587.33, 659.25, 783.99].forEach(function (f, k) { pluck(f, t + 0.75 + k * 0.13, 1.1, 0.2); });
        chirp(t + 1.3, 2800, 4200, 0.07, 0.05);
        chirp(t + 1.4, 3000, 4400, 0.06, 0.045);
        chirp(t + 1.5, 3100, 4300, 0.06, 0.04);
      }
    } catch (e) { /* no sound, the animation still plays */ }
    function done() {
      var s = document.getElementById("splash");
      if (!s) return;
      s.classList.add("out");
      setTimeout(function () { s.remove(); }, 550);
    }
    function check() {
      var ready = document.getElementById("app") && document.getElementById("app").children.length;
      if ((ready && Date.now() - t0 >= 2100) || Date.now() - t0 > 6000) done();
      else setTimeout(check, 100);
    }
    setTimeout(check, 2100);
  })();
</script>
